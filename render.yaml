services:
  - type: web
    name: minecraft-username-monitor
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: HOST
        value: 0.0.0.0
      - key: RUN_WORKER
        value: "1"
      - key: SECURE_COOKIES
        value: "1"
      - key: DATABASE_URL
        value: sqlite:////var/data/sniper.db
      - key: MAX_ACCOUNTS
        value: "25"
      - key: APP_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
    disk:
      name: sniper-data
      mountPath: /var/data
      sizeGB: 1
